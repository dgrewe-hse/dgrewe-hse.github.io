<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-label="AI usage categories during the experiment">
  <rect width="560" height="380" fill="#0a0a0a"/>

  <!-- Legend -->
  <rect x="150" y="18" width="12" height="12" fill="#8cb4e8" stroke="#5a8fc7"/>
  <text x="168" y="28" fill="#ccc" font-family="Arial, Helvetica, sans-serif" font-size="12">Group A (Control)</text>
  <rect x="300" y="18" width="12" height="12" fill="#1e3a66" stroke="#142844"/>
  <text x="318" y="28" fill="#ccc" font-family="Arial, Helvetica, sans-serif" font-size="12">Group B (Experimental)</text>

  <!-- Y-axis label -->
  <text x="18" y="200" fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="12" transform="rotate(-90 18 200)">Number of instances</text>

  <!-- Grid + Y ticks (0-15) -->
  <g stroke="#333" stroke-width="1">
    <line x1="60" y1="300" x2="520" y2="300"/>
    <line x1="60" y1="80" x2="520" y2="80" stroke-dasharray="2,4"/>
    <line x1="60" y1="124.4" x2="520" y2="124.4" stroke-dasharray="2,4"/>
    <line x1="60" y1="168.9" x2="520" y2="168.9" stroke-dasharray="2,4"/>
    <line x1="60" y1="213.3" x2="520" y2="213.3" stroke-dasharray="2,4"/>
    <line x1="60" y1="257.8" x2="520" y2="257.8" stroke-dasharray="2,4"/>
  </g>
  <g fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="end">
    <text x="52" y="304">0</text>
    <text x="52" y="260">4</text>
    <text x="52" y="217">8</text>
    <text x="52" y="173">12</text>
    <text x="52" y="84">15</text>
  </g>

  <!-- Scale: y=300 is 0, y=80 is 15. Range 220px / 15 = 14.67px per unit -->

  <!-- (1) Code gen: A=13, B=11 -->
  <rect x="98" y="109.3" width="14" height="190.7" fill="#8cb4e8" stroke="#5a8fc7"/>
  <rect x="116" y="138.7" width="14" height="161.3" fill="#1e3a66" stroke="#142844"/>

  <!-- (2) Concept understanding: A=7, B=9 -->
  <rect x="198" y="197.3" width="14" height="102.7" fill="#8cb4e8" stroke="#5a8fc7"/>
  <rect x="216" y="168.0" width="14" height="132.0" fill="#1e3a66" stroke="#142844"/>

  <!-- (3) Debugging: A=4, B=8 -->
  <rect x="318" y="241.3" width="14" height="58.7" fill="#8cb4e8" stroke="#5a8fc7"/>
  <rect x="336" y="182.7" width="14" height="117.3" fill="#1e3a66" stroke="#142844"/>

  <!-- (4) Syntax lookup: A=6, B=1 -->
  <rect x="438" y="212.0" width="14" height="88.0" fill="#8cb4e8" stroke="#5a8fc7"/>
  <rect x="456" y="285.3" width="14" height="14.7" fill="#1e3a66" stroke="#142844"/>

  <!-- X-axis labels -->
  <g fill="#aaa" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">
    <text x="112" y="322"><tspan x="112" dy="0">Code</tspan><tspan x="112" dy="14">gen.</tspan></text>
    <text x="212" y="322"><tspan x="212" dy="0">Concept</tspan><tspan x="212" dy="14">understanding</tspan></text>
    <text x="332" y="328">Debugging</text>
    <text x="452" y="322"><tspan x="452" dy="0">Syntax</tspan><tspan x="452" dy="14">lookup</tspan></text>
  </g>
</svg>
